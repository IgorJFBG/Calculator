<html>

<head>
    <title>Basic Calculator</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body id="body">
    <div id="content">
        <div id="display">
            <input type="text" id="result" value="0" readonly />
        </div>
        <div id="buttons">
            <table>
                <tr>
                    <td>
                        <button class="system" onClick="CEFunction()" disabled>🔶</button>
                    </td>
                    <td>
                        <button class="function" onClick="openContainer()">(</button>
                    </td>
                    <td>
                        <button class="function" onClick="closeContainer()">)</button>
                    </td>
                    <td>
                        <button class="system" onClick="CEFunction()">🆑</button>
                    </td>
                    <td>
                        <button class="system" onClick="ACFunction()">🛑</button>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button class="function" onClick="factorial()">n!</button>
                    </td>
                    <td>
                        <button class="function" onClick="sinFunction()">sen</button>
                    </td>
                    <td>
                        <button class="function" onClick="cosFunction()">cos</button>
                    </td>
                    <td>
                        <button class="function" onClick="tanFunction()">tan</button>
                    </td>
                    <td>
                        <button class="number" onClick="percentage()">%</button>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button class="function" onClick="" disabled></button>
                    </td>
                    <td>
                        <button class="function" onClick="eulerConstant()">e</button>
                    </td>
                    <td>
                        <button class="function" onClick="piConstant()">π</button>
                    </td>
                    <td>
                        <button class="function" onClick="addExpression('log')">log</button>
                    </td>
                    <td>
                        <button class="function" onClick="" disabled></button>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button class="number" onClick="addNumber(7)">7</button>
                    </td>
                    <td>
                        <button class="number" onClick="addNumber(8)">8</button>
                    </td>
                    <td>
                        <button class="number" onClick="addNumber(9)">9</button>
                    </td>
                    <td>
                        <button class="function" onClick="addExpression('^')">x<sup>y</sup></button>
                    </td>
                    <td>
                        <button class="function" onClick="addExpression('√')"><sup>y</sup>√<span>x</span>
                        </button>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button class="number" onClick="addNumber(4)">4</button>
                    </td>
                    <td>
                        <button class="number" onClick="addNumber(5)">5</button>
                    </td>
                    <td>
                        <button class="number" onClick="addNumber(6)">6</button>
                    </td>
                    <td>
                        <button class="operator" onClick="addExpression('×')">×</button>
                    </td>
                    <td>
                        <button class="operator" onClick="addExpression('÷')">÷</button>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button class="number" onClick="addNumber(1)">1</button>
                    </td>
                    <td>
                        <button class="number" onClick="addNumber(2)">2</button>
                    </td>
                    <td>
                        <button class="number" onClick="addNumber(3)">3</button>
                    </td>
                    <td>
                        <button class="operator" onClick="addExpression('+')">+</button>
                    </td>
                    <td>
                        <button class="operator" onClick="addExpression('-')">-</button>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button class="function" onClick="negativate()">+/-</button>
                    </td>
                    <td>
                        <button class="number" onClick="addNumber(0)">0</button>
                    </td>
                    <td>
                        <button class="function" onClick="decimalFunction()">.</button>
                    </td>
                    <td colspan="2">
                        <button class="operator" onClick="equal()">=</button>
                    </td>
                </tr>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
